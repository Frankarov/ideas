<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji Swap Multiplayer (P2P)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PeerJS for Direct P2P WebRTC Connection -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <style>
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .tile {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse-border-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        @keyframes pulse-border-blue {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .selected-p1 { animation: pulse-border-red 1.5s infinite; z-index: 20; background-color: rgba(239, 68, 68, 0.2); }
        .selected-p2 { animation: pulse-border-blue 1.5s infinite; z-index: 20; background-color: rgba(59, 130, 246, 0.2); }
        
        .cursor-p1 { border: 4px solid #ef4444; z-index: 10; box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.5); }
        .cursor-p2 { border: 4px solid #3b82f6; z-index: 10; box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.5); }
        
        .ctrl-btn:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.2);
        }

        .locked-glow {
            box-shadow: inset 0 0 15px rgba(16, 185, 129, 0.6);
            border-color: #10b981 !important;
            background-color: rgba(16, 185, 129, 0.15) !important;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans flex flex-col items-center justify-center overflow-hidden">

    <div id="app" class="w-full h-full flex items-center justify-center absolute inset-0">
        <div class="text-2xl animate-pulse text-gray-400">Initializing P2P Game Engine...</div>
    </div>

    <script>
        const LEVELS = [
            {
                name: "Level 1: Classic Sets",
                categories: [
                    ['🐶', '🐱', '🐭', '🐰'], // Animals
                    ['🍎', '🍌', '🍇', '🍉'], // Fruits
                    ['🚗', '🚕', '🚙', '🚌'], // Vehicles
                    ['⚽', '🏀', '🏈', '⚾']  // Sports
                ]
            },
            {
                name: "Level 2: Ocean & Sky",
                categories: [
                    ['🐳', '🐬', '🐟', '🦈'], // Sea Animals
                    ['✈️', '🚀', '🚁', '🛸'], // Aircrafts
                    ['☀️', '⭐', '☁️', '🌈'], // Weather
                    ['🎸', '🎹', '🥁', '🎷']  // Instruments
                ]
            },
            {
                name: "Level 3: Sweet Treats & Nature",
                categories: [
                    ['🍕', '🍔', '🍟', '🍿'], // Fast Food
                    ['🍩', '🍪', '🎂', '🍫'], // Sweets
                    ['🌲', '🌵', '🌻', '🍄'], // Plants
                    ['💎', '👑', '💍', '🔮']  // Treasures
                ]
            }
        ];

        function generateShuffledGrid(levelIndex) {
            let cats = LEVELS[levelIndex % LEVELS.length].categories;
            let emojis = cats.flat();
            for (let i = emojis.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [emojis[i], emojis[j]] = [emojis[j], emojis[i]];
            }
            const grid = [];
            for (let i = 0; i < 4; i++) {
                grid.push(emojis.slice(i * 4, i * 4 + 4));
            }
            return grid;
        }

        function getCompletedRowsAndCols(grid, levelIndex) {
            let cats = LEVELS[levelIndex % LEVELS.length].categories;
            function getCatIndex(emoji) {
                return cats.findIndex(cat => cat.includes(emoji));
            }

            let lockedRows = [false, false, false, false];
            let lockedCols = [false, false, false, false];

            // Check rows
            let usedRowCats = new Set();
            for (let r = 0; r < 4; r++) {
                let firstCat = getCatIndex(grid[r][0]);
                let isRowValid = firstCat !== -1;
                for (let c = 1; c < 4; c++) {
                    if (getCatIndex(grid[r][c]) !== firstCat) {
                        isRowValid = false;
                        break;
                    }
                }
                if (isRowValid) {
                    lockedRows[r] = true;
                    usedRowCats.add(firstCat);
                }
            }

            // Check cols
            let usedColCats = new Set();
            for (let c = 0; c < 4; c++) {
                let firstCat = getCatIndex(grid[0][c]);
                let isColValid = firstCat !== -1;
                for (let r = 1; r < 4; r++) {
                    if (getCatIndex(grid[r][c]) !== firstCat) {
                        isColValid = false;
                        break;
                    }
                }
                if (isColValid) {
                    lockedCols[c] = true;
                    usedColCats.add(firstCat);
                }
            }

            return { lockedRows, lockedCols };
        }

        function checkWin(grid, levelIndex) {
            let { lockedRows, lockedCols } = getCompletedRowsAndCols(grid, levelIndex);
            let rowCount = lockedRows.filter(Boolean).length;
            let colCount = lockedCols.filter(Boolean).length;
            // Win if either all 4 rows are completed or all 4 columns are completed
            return rowCount === 4 || colCount === 4;
        }

        function vibrate(pattern = 50) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        function generateRandomId() {
            return Math.random().toString(36).substring(2, 8);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const view = urlParams.get('view');
        const playerNum = urlParams.get('p');
        const hostPeerId = urlParams.get('host');
        const localMode = urlParams.get('local') === 'true';

        if (view === 'ctrl' && playerNum && hostPeerId) {
            initController(playerNum, hostPeerId);
        } else if (localMode) {
            initLocalGame();
        } else {
            initHost();
        }

        // ==========================================
        // LOCAL DESKTOP GAME IMPLEMENTATION (Same Screen)
        // ==========================================
        function initLocalGame() {
            let gameState = {
                status: 'playing', // playing, won
                level: 0,
                grid: generateShuffledGrid(0),
                p1: { cursor: {r: 0, c: 0}, selected: null },
                p2: { cursor: {r: 3, c: 3}, selected: null }
            };

            function handleLocalAction(pKey, action) {
                if (gameState.status === 'playing') {
                    let cursor = gameState[pKey].cursor;
                    let { lockedRows, lockedCols } = getCompletedRowsAndCols(gameState.grid, gameState.level);

                    if (action === 'up') cursor.r = Math.max(0, cursor.r - 1);
                    if (action === 'down') cursor.r = Math.min(3, cursor.r + 1);
                    if (action === 'left') cursor.c = Math.max(0, cursor.c - 1);
                    if (action === 'right') cursor.c = Math.min(3, cursor.c + 1);

                    if (action === 'select') {
                        let curR = cursor.r;
                        let curC = cursor.c;

                        if (lockedRows[curR] || lockedCols[curC]) {
                            return; // Cannot touch locked tiles
                        }

                        if (gameState[pKey].selected) {
                            gameState[pKey].selected = null;
                        } else {
                            gameState[pKey].selected = { ...cursor };
                        }

                        // Check if both selected
                        if (gameState.p1.selected && gameState.p2.selected) {
                            let r1 = gameState.p1.selected.r;
                            let c1 = gameState.p1.selected.c;
                            let r2 = gameState.p2.selected.r;
                            let c2 = gameState.p2.selected.c;

                            if (!lockedRows[r1] && !lockedCols[c1] && !lockedRows[r2] && !lockedCols[c2]) {
                                let g = gameState.grid;
                                let t1 = g[r1][c1];
                                let t2 = g[r2][c2];

                                g[r1][c1] = t2;
                                g[r2][c2] = t1;
                            }

                            gameState.p1.selected = null;
                            gameState.p2.selected = null;

                            if (checkWin(gameState.grid, gameState.level)) {
                                gameState.status = 'won';
                            }
                        }
                    }
                    renderLocalUI();
                } else if (gameState.status === 'won') {
                    if (action === 'next_level') {
                        gameState.level = (gameState.level + 1) % LEVELS.length;
                        gameState.status = 'playing';
                        gameState.grid = generateShuffledGrid(gameState.level);
                        gameState.p1.selected = null;
                        gameState.p2.selected = null;
                        renderLocalUI();
                    } else if (action === 'restart') {
                        gameState.status = 'playing';
                        gameState.level = 0;
                        gameState.grid = generateShuffledGrid(0);
                        gameState.p1.selected = null;
                        gameState.p2.selected = null;
                        renderLocalUI();
                    }
                }
            }

            // Keyboard event listener for local play
            window.addEventListener('keydown', (e) => {
                if (e.repeat) return; // Prevent crazy fast scrolling on hold
                // Player 1 controls (WASD + Space)
                if (e.key === 'w' || e.key === 'W') handleLocalAction('p1', 'up');
                if (e.key === 's' || e.key === 'S') handleLocalAction('p1', 'down');
                if (e.key === 'a' || e.key === 'A') handleLocalAction('p1', 'left');
                if (e.key === 'd' || e.key === 'D') handleLocalAction('p1', 'right');
                if (e.code === 'Space') { e.preventDefault(); handleLocalAction('p1', 'select'); }

                // Player 2 controls (Arrow keys + Enter / Return)
                if (e.key === 'ArrowUp') { e.preventDefault(); handleLocalAction('p2', 'up'); }
                if (e.key === 'ArrowDown') { e.preventDefault(); handleLocalAction('p2', 'down'); }
                if (e.key === 'ArrowLeft') { e.preventDefault(); handleLocalAction('p2', 'left'); }
                if (e.key === 'ArrowRight') { e.preventDefault(); handleLocalAction('p2', 'right'); }
                if (e.key === 'Enter') { e.preventDefault(); handleLocalAction('p2', 'select'); }
            });

            window.renderLocalUI = function() {
                const appDiv = document.getElementById('app');
                let { lockedRows, lockedCols } = getCompletedRowsAndCols(gameState.grid, gameState.level);
                let currentLevelObj = LEVELS[gameState.level % LEVELS.length];

                let gridHtml = '';
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        let isLocked = lockedRows[r] || lockedCols[c];
                        let classes = `tile w-16 h-16 md:w-24 md:h-24 bg-gray-900 border border-gray-800 rounded-2xl flex items-center justify-center text-3xl md:text-5xl relative shadow-xl ${isLocked ? 'locked-glow' : ''}`;
                        let innerHtml = `<span>${gameState.grid[r][c]}</span>`;
                        let overlays = '';

                        if (gameState.p1.selected && gameState.p1.selected.r === r && gameState.p1.selected.c === c) {
                            overlays += `<div class="absolute inset-0 rounded-2xl selected-p1 pointer-events-none"></div>`;
                        }
                        if (gameState.p2.selected && gameState.p2.selected.r === r && gameState.p2.selected.c === c) {
                            overlays += `<div class="absolute inset-0 rounded-2xl selected-p2 pointer-events-none"></div>`;
                        }
                        if (gameState.p1.cursor.r === r && gameState.p1.cursor.c === c) {
                            overlays += `<div class="absolute inset-0 rounded-2xl cursor-p1 pointer-events-none"></div>`;
                        }
                        if (gameState.p2.cursor.r === r && gameState.p2.cursor.c === c) {
                            overlays += `<div class="absolute inset-0 rounded-2xl cursor-p2 pointer-events-none"></div>`;
                        }

                        gridHtml += `<div class="${classes}">${innerHtml}${overlays}</div>`;
                    }
                }

                appDiv.innerHTML = `
                    <div class="flex flex-col items-center p-4">
                        <div class="mb-2 flex items-center space-x-6">
                            <span class="px-4 py-1.5 rounded-full bg-purple-900/60 border border-purple-500/50 text-purple-300 font-semibold text-sm uppercase tracking-wider">${currentLevelObj.name}</span>
                            <a href="${window.location.origin + window.location.pathname}" class="text-xs text-gray-400 hover:text-white underline">Back to P2P QR Mode</a>
                        </div>

                        <div class="mb-4 flex space-x-12 text-sm">
                            <div class="flex items-center space-x-2 bg-red-950/40 px-3 py-1 rounded-lg border border-red-900/50">
                                <div class="w-4 h-4 bg-red-500 rounded-full"></div>
                                <span class="font-bold text-red-300">P1 (WASD + Space)</span>
                            </div>
                            <div class="flex items-center space-x-2 bg-blue-950/40 px-3 py-1 rounded-lg border border-blue-900/50">
                                <div class="w-4 h-4 bg-blue-500 rounded-full"></div>
                                <span class="font-bold text-blue-300">P2 (Arrows + Enter)</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-4 gap-3 bg-gray-900/90 p-5 rounded-[2rem] shadow-2xl border border-gray-800 relative">
                            ${gridHtml}
                            
                            ${gameState.status === 'won' ? `
                                <div class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center z-50">
                                    <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-2 drop-shadow-lg">LEVEL CLEARED!</h1>
                                    <p class="text-gray-300 mb-6">Fantastic teamwork solving ${currentLevelObj.name}!</p>
                                    <div class="flex space-x-4">
                                        <button onclick="handleLocalAction('next_level', 'next_level')" class="px-6 py-3 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-500 transition-colors">Next Level ➡️</button>
                                        <button onclick="handleLocalAction('restart', 'restart')" class="px-6 py-3 rounded-xl bg-gray-800 text-gray-300 font-bold hover:bg-gray-700 transition-colors">Restart</button>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                        
                        <div class="mt-4 text-gray-400 text-xs text-center max-w-md">
                            Matched rows & columns turn green and lock permanently. Both players select their tile to swap them simultaneously!
                        </div>
                    </div>
                `;
            };

            renderLocalUI();
        }

        // ==========================================
        // HOST IMPLEMENTATION (Desktop with QR)
        // ==========================================
        function initHost() {
            const uniqueId = generateRandomId();
            const p1PeerId = `emoji_host_p1_${uniqueId}`;
            const p2PeerId = `emoji_host_p2_${uniqueId}`;

            let gameState = {
                status: 'waiting', // waiting, playing, won
                level: 0,
                grid: generateShuffledGrid(0),
                p1: { connected: false, ready: false, cursor: {r: 0, c: 0}, selected: null },
                p2: { connected: false, ready: false, cursor: {r: 3, c: 3}, selected: null }
            };

            let p1Connection = null;
            let p2Connection = null;

            const peerOptions = {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            };

            let peer1, peer2;
            try {
                peer1 = new Peer(p1PeerId, peerOptions);
                peer2 = new Peer(p2PeerId, peerOptions);
            } catch(e) {
                peer1 = new Peer(p1PeerId);
                peer2 = new Peer(p2PeerId);
            }

            peer1.on('connection', (conn) => {
                p1Connection = conn;
                gameState.p1.connected = true;
                setupConnectionHandlers(conn, 'p1');
                broadcastState();
            });

            peer2.on('connection', (conn) => {
                p2Connection = conn;
                gameState.p2.connected = true;
                setupConnectionHandlers(conn, 'p2');
                broadcastState();
            });

            function setupConnectionHandlers(conn, pKey) {
                conn.on('data', (data) => {
                    handleControllerAction(pKey, data);
                });
                conn.on('close', () => {
                    gameState[pKey].connected = false;
                    gameState[pKey].ready = false;
                    gameState.status = 'waiting';
                    broadcastState();
                });
            }

            function broadcastState() {
                if (p1Connection && p1Connection.open) p1Connection.send({ type: 'STATE', state: gameState });
                if (p2Connection && p2Connection.open) p2Connection.send({ type: 'STATE', state: gameState });
                renderHostUI();
            }

            function handleControllerAction(pKey, actionData) {
                const { action, payload } = actionData;

                if (gameState.status === 'waiting') {
                    if (action === 'ready') {
                        gameState[pKey].ready = true;
                        if (gameState.p1.ready && gameState.p2.ready) {
                            gameState.status = 'playing';
                        }
                        broadcastState();
                    }
                } else if (gameState.status === 'playing') {
                    if (action === 'move') {
                        let cursor = gameState[pKey].cursor;
                        if (payload === 'up') cursor.r = Math.max(0, cursor.r - 1);
                        if (payload === 'down') cursor.r = Math.min(3, cursor.r + 1);
                        if (payload === 'left') cursor.c = Math.max(0, cursor.c - 1);
                        if (payload === 'right') cursor.c = Math.min(3, cursor.c + 1);
                        broadcastState();
                    }
                    if (action === 'select') {
                        let { lockedRows, lockedCols } = getCompletedRowsAndCols(gameState.grid, gameState.level);
                        let curR = gameState[pKey].cursor.r;
                        let curC = gameState[pKey].cursor.c;

                        if (lockedRows[curR] || lockedCols[curC]) {
                            return; // Cannot touch locked tiles
                        }

                        if (gameState[pKey].selected) {
                            gameState[pKey].selected = null;
                        } else {
                            gameState[pKey].selected = { ...gameState[pKey].cursor };
                        }

                        if (gameState.p1.selected && gameState.p2.selected) {
                            let r1 = gameState.p1.selected.r;
                            let c1 = gameState.p1.selected.c;
                            let r2 = gameState.p2.selected.r;
                            let c2 = gameState.p2.selected.c;

                            if (!lockedRows[r1] && !lockedCols[c1] && !lockedRows[r2] && !lockedCols[c2]) {
                                let g = gameState.grid;
                                let t1 = g[r1][c1];
                                let t2 = g[r2][c2];

                                g[r1][c1] = t2;
                                g[r2][c2] = t1;
                            }

                            gameState.p1.selected = null;
                            gameState.p2.selected = null;

                            if (checkWin(gameState.grid, gameState.level)) {
                                gameState.status = 'won';
                            }
                        }
                        broadcastState();
                    }
                } else if (gameState.status === 'won') {
                    if (action === 'next_level') {
                        gameState.level = (gameState.level + 1) % LEVELS.length;
                        gameState.status = 'playing';
                        gameState.grid = generateShuffledGrid(gameState.level);
                        gameState.p1.selected = null;
                        gameState.p2.selected = null;
                        broadcastState();
                    } else if (action === 'restart') {
                        gameState.status = 'waiting';
                        gameState.level = 0;
                        gameState.grid = generateShuffledGrid(0);
                        gameState.p1.ready = false;
                        gameState.p2.ready = false;
                        gameState.p1.selected = null;
                        gameState.p2.selected = null;
                        broadcastState();
                    }
                }
            }

            window.renderHostUI = function() {
                const appDiv = document.getElementById('app');
                const baseUrl = window.location.origin + window.location.pathname;
                const p1Url = `${baseUrl}?view=ctrl&p=1&host=${p1PeerId}`;
                const p2Url = `${baseUrl}?view=ctrl&p=2&host=${p2PeerId}`;
                const localUrl = `${baseUrl}?local=true`;

                if (gameState.status === 'waiting') {
                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center w-full max-w-4xl p-6 bg-gray-900 border border-gray-800 rounded-3xl shadow-2xl">
                            <h1 class="text-4xl font-extrabold mb-1 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">Emoji Swap Puzzle</h1>
                            <p class="text-gray-400 mb-6 text-sm text-center">Match 4 emojis of the same category in a row or column together! Completed rows/cols lock permanently.</p>
                            
                            <div class="flex flex-col md:flex-row w-full justify-around items-center gap-6 mb-6">
                                <!-- P1 QR -->
                                <div class="flex flex-col items-center p-4 bg-gray-800/80 rounded-2xl border-2 ${gameState.p1.connected ? 'border-red-500' : 'border-gray-700'}">
                                    <h2 class="text-xl font-bold mb-2 text-red-400">Player 1 (Red)</h2>
                                    <div id="qr-p1" class="bg-white p-2 rounded-xl mb-2 shadow-lg"></div>
                                    <div class="h-6 text-xs text-center">
                                        ${gameState.p1.ready ? '<span class="text-green-400 font-bold">READY!</span>' : 
                                          gameState.p1.connected ? '<span class="text-yellow-400">Connected, waiting...</span>' : 
                                          '<span class="text-gray-400 animate-pulse">Scan with smartphone</span>'}
                                    </div>
                                </div>

                                <div class="text-2xl font-bold text-gray-600">VS / CO-OP</div>

                                <!-- P2 QR -->
                                <div class="flex flex-col items-center p-4 bg-gray-800/80 rounded-2xl border-2 ${gameState.p2.connected ? 'border-blue-500' : 'border-gray-700'}">
                                    <h2 class="text-xl font-bold mb-2 text-blue-400">Player 2 (Blue)</h2>
                                    <div id="qr-p2" class="bg-white p-2 rounded-xl mb-2 shadow-lg"></div>
                                    <div class="h-6 text-xs text-center">
                                        ${gameState.p2.ready ? '<span class="text-green-400 font-bold">READY!</span>' : 
                                          gameState.p2.connected ? '<span class="text-yellow-400">Connected, waiting...</span>' : 
                                          '<span class="text-gray-400 animate-pulse">Scan with smartphone</span>'}
                                    </div>
                                </div>
                            </div>

                            <div class="border-t border-gray-800 pt-4 w-full flex flex-col items-center">
                                <span class="text-gray-400 text-sm mb-2">Don't have 2 smartphones handy?</span>
                                <a href="${localUrl}" class="px-6 py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm transition-colors shadow-lg shadow-purple-900/40">
                                    💻 Play Locally on This Desktop
                                </a>
                            </div>
                        </div>
                    `;

                    const qr1El = document.getElementById('qr-p1');
                    if (qr1El && qr1El.innerHTML === '') {
                        new QRCode(qr1El, { text: p1Url, width: 130, height: 130, colorDark : "#000000", colorLight : "#ffffff" });
                    }
                    const qr2El = document.getElementById('qr-p2');
                    if (qr2El && qr2El.innerHTML === '') {
                        new QRCode(qr2El, { text: p2Url, width: 130, height: 130, colorDark : "#000000", colorLight : "#ffffff" });
                    }

                } else {
                    let { lockedRows, lockedCols } = getCompletedRowsAndCols(gameState.grid, gameState.level);
                    let currentLevelObj = LEVELS[gameState.level % LEVELS.length];

                    let gridHtml = '';
                    for (let r = 0; r < 4; r++) {
                        for (let c = 0; c < 4; c++) {
                            let isLocked = lockedRows[r] || lockedCols[c];
                            let classes = `tile w-20 h-20 md:w-28 md:h-28 bg-gray-900 border border-gray-800 rounded-2xl flex items-center justify-center text-4xl md:text-6xl relative shadow-xl ${isLocked ? 'locked-glow' : ''}`;
                            let innerHtml = `<span>${gameState.grid[r][c]}</span>`;
                            let overlays = '';

                            if (gameState.p1.selected && gameState.p1.selected.r === r && gameState.p1.selected.c === c) {
                                overlays += `<div class="absolute inset-0 rounded-2xl selected-p1 pointer-events-none"></div>`;
                            }
                            if (gameState.p2.selected && gameState.p2.selected.r === r && gameState.p2.selected.c === c) {
                                overlays += `<div class="absolute inset-0 rounded-2xl selected-p2 pointer-events-none"></div>`;
                            }
                            if (gameState.p1.cursor.r === r && gameState.p1.cursor.c === c) {
                                overlays += `<div class="absolute inset-0 rounded-2xl cursor-p1 pointer-events-none"></div>`;
                            }
                            if (gameState.p2.cursor.r === r && gameState.p2.cursor.c === c) {
                                overlays += `<div class="absolute inset-0 rounded-2xl cursor-p2 pointer-events-none"></div>`;
                            }

                            gridHtml += `<div class="${classes}">${innerHtml}${overlays}</div>`;
                        }
                    }

                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center">
                            <div class="mb-4 flex items-center space-x-6">
                                <span class="px-4 py-1.5 rounded-full bg-purple-900/60 border border-purple-500/50 text-purple-300 font-semibold text-sm uppercase tracking-wider">${currentLevelObj.name}</span>
                            </div>

                            <div class="mb-6 flex space-x-12">
                                <div class="flex items-center space-x-3">
                                    <div class="w-6 h-6 bg-red-500 rounded-full animate-pulse shadow-[0_0_15px_rgba(239,68,68,0.8)]"></div>
                                    <span class="text-xl font-bold text-gray-300">Player 1</span>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <div class="w-6 h-6 bg-blue-500 rounded-full animate-pulse shadow-[0_0_15px_rgba(59,130,246,0.8)]"></div>
                                    <span class="text-xl font-bold text-gray-300">Player 2</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-4 gap-3 md:gap-4 bg-gray-900/90 p-6 md:p-8 rounded-[2rem] shadow-2xl border border-gray-800 relative">
                                ${gridHtml}
                                
                                ${gameState.status === 'won' ? `
                                    <div class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center z-50">
                                        <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-4 drop-shadow-lg">LEVEL CLEARED!</h1>
                                        <p class="text-xl text-gray-300 mb-8">Fantastic teamwork solving ${currentLevelObj.name}!</p>
                                        <div class="text-gray-400 text-sm animate-pulse">Use your smartphone controller to proceed to the next level</div>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div class="mt-6 text-gray-400 text-sm text-center max-w-lg">
                                Matched rows & columns light up in green and lock permanently. Select tiles using controllers to swap unlocked pieces.
                            </div>
                        </div>
                    `;
                }
            };

            renderHostUI();
        }

        // ==========================================
        // CONTROLLER IMPLEMENTATION (Smartphone)
        // ==========================================
        function initController(playerNum, hostPeerId) {
            const appDiv = document.getElementById('app');
            const themeColor = playerNum === '1' ? 'red' : 'blue';
            const themeHex = playerNum === '1' ? '#ef4444' : '#3b82f6';
            
            document.body.style.backgroundColor = playerNum === '1' ? '#2a0d0d' : '#0d1b2a';

            appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full w-full p-6 text-center">
                    <div class="text-3xl font-black text-${themeColor}-400 mb-4">PLAYER ${playerNum}</div>
                    <div class="text-lg text-gray-300 animate-pulse">Connecting to Desktop Host...</div>
                </div>
            `;

            let clientPeer;
            try {
                clientPeer = new Peer({
                    host: '0.peerjs.com',
                    port: 443,
                    secure: true,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });
            } catch(e) {
                clientPeer = new Peer();
            }

            let conn = null;
            let latestState = null;

            clientPeer.on('open', () => {
                conn = clientPeer.connect(hostPeerId);
                
                conn.on('open', () => {
                    renderControllerScreen('waiting');
                });

                conn.on('data', (data) => {
                    if (data.type === 'STATE') {
                        latestState = data.state;
                        renderControllerScreen(latestState.status);
                    }
                });

                conn.on('close', () => {
                    appDiv.innerHTML = `<div class="text-red-400 text-xl font-bold">Disconnected from Host.</div>`;
                });
            });

            window.sendAction = function(action, payload = null) {
                vibrate(40);
                if (conn && conn.open) {
                    conn.send({ action, payload });
                }
            };

            function renderControllerScreen(status) {
                const pKey = `p${playerNum}`;
                const pData = latestState ? latestState[pKey] : null;

                if (status === 'waiting') {
                    const isReady = pData ? pData.ready : false;
                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full w-full p-6 text-center">
                            <div class="text-3xl font-black text-${themeColor}-400 mb-10">PLAYER ${playerNum}</div>
                            ${isReady ? 
                                `<div class="text-2xl font-bold text-green-400 animate-pulse">Waiting for other player...</div>` :
                                `<button onclick="sendAction('ready')" class="w-64 h-64 rounded-full bg-gradient-to-tr from-${themeColor}-600 to-${themeColor}-400 shadow-[0_0_40px_${themeHex}80] text-white text-4xl font-black tracking-widest active:scale-95 transition-transform flex items-center justify-center uppercase">
                                    Start<br>Game
                                 </button>`
                            }
                        </div>
                    `;
                } else if (status === 'playing') {
                    const isSelected = pData && pData.selected !== null;

                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-between h-full w-full py-10 px-4">
                            <div class="text-xl font-bold text-${themeColor}-300 tracking-widest uppercase">
                                ${isSelected ? 'Waiting for partner...' : 'Select a tile'}
                            </div>
                            
                            <!-- D-Pad -->
                            <div class="grid grid-cols-3 gap-2 w-full max-w-[280px] aspect-square relative my-auto">
                                <div class="absolute inset-1/3 bg-gray-900 rounded-3xl opacity-50"></div>
                                
                                <div></div>
                                <button onclick="sendAction('move', 'up')" class="ctrl-btn bg-gray-800 rounded-t-3xl shadow-lg border-t border-gray-700 flex items-center justify-center text-4xl" ${isSelected ? 'disabled style="opacity:0.3"' : ''}>▲</button>
                                <div></div>
                                
                                <button onclick="sendAction('move', 'left')" class="ctrl-btn bg-gray-800 rounded-l-3xl shadow-lg border-l border-gray-700 flex items-center justify-center text-4xl" ${isSelected ? 'disabled style="opacity:0.3"' : ''}>◀</button>
                                <div class="bg-gray-900 rounded-lg flex items-center justify-center">
                                    <div class="w-4 h-4 rounded-full bg-${themeColor}-500/50 shadow-[0_0_10px_${themeHex}]"></div>
                                </div>
                                <button onclick="sendAction('move', 'right')" class="ctrl-btn bg-gray-800 rounded-r-3xl shadow-lg border-r border-gray-700 flex items-center justify-center text-4xl" ${isSelected ? 'disabled style="opacity:0.3"' : ''}>▶</button>
                                
                                <div></div>
                                <button onclick="sendAction('move', 'down')" class="ctrl-btn bg-gray-800 rounded-b-3xl shadow-lg border-b border-gray-700 flex items-center justify-center text-4xl" ${isSelected ? 'disabled style="opacity:0.3"' : ''}>▼</button>
                                <div></div>
                            </div>

                            <!-- Action Button -->
                            <div class="w-full max-w-[280px]">
                                <button onclick="sendAction('select')" class="w-full py-6 rounded-[2rem] text-3xl font-black text-white shadow-2xl transition-all active:scale-95 ${
                                    isSelected 
                                    ? 'bg-gray-700 shadow-[0_0_20px_rgba(156,163,175,0.3)] border-2 border-gray-500'
                                    : `bg-${themeColor}-600 shadow-[0_0_30px_${themeHex}80] border-2 border-${themeColor}-400`
                                }">
                                    ${isSelected ? 'CANCEL' : 'SELECT / SWAP'}
                                </button>
                            </div>
                        </div>
                    `;
                } else if (status === 'won') {
                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full w-full p-6 text-center">
                            <div class="text-6xl mb-4">🏆</div>
                            <h1 class="text-3xl font-black text-yellow-400 mb-8 drop-shadow-lg">LEVEL COMPLETED!</h1>
                            
                            <button onclick="sendAction('next_level')" class="w-full max-w-[250px] py-5 mb-4 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 shadow-[0_0_30px_rgba(147,51,234,0.8)] text-white text-xl font-black active:scale-95 transition-transform uppercase">
                                Next Level ➡️
                            </button>
                            <button onclick="sendAction('restart')" class="w-full max-w-[250px] py-4 rounded-full bg-gray-800 border border-gray-700 text-gray-300 text-lg font-bold active:scale-95 transition-transform uppercase">
                                Restart Game
                            </button>
                        </div>
                    `;
                }
            }
        }
    </script>
</body>
</html>
