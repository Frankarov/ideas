<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Emoji Swap Multiplayer (P2P)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PeerJS for Direct P2P WebRTC Connection -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <style>
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .tile {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse-border-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        @keyframes pulse-border-blue {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .selected-p1 { animation: pulse-border-red 1.5s infinite; z-index: 20; background-color: rgba(239, 68, 68, 0.2); }
        .selected-p2 { animation: pulse-border-blue 1.5s infinite; z-index: 20; background-color: rgba(59, 130, 246, 0.2); }
        
        .cursor-p1 { border: 4px solid #ef4444; z-index: 10; box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.5); }
        .cursor-p2 { border: 4px solid #3b82f6; z-index: 10; box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.5); }
        
        .ctrl-btn:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.2);
        }

        .locked-glow {
            box-shadow: inset 0 0 15px rgba(16, 185, 129, 0.6);
            border-color: #10b981 !important;
            background-color: rgba(16, 185, 129, 0.15) !important;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans flex flex-col items-center justify-center overflow-hidden">

    <div id="app" class="w-full h-full flex items-center justify-center absolute inset-0">
        <div class="text-2xl animate-pulse text-gray-400">Initializing P2P Game Engine...</div>
    </div>

    <script>
        const ALL_CATEGORIES = [
            ['🐶', '🐱', '🐭', '🐰', '🦊', '🐻', '🐼', '🐨'], // Animals
            ['🍎', '🍌', '🍇', '🍉', '🍓', '🍑', '🍍', '🥝'], // Fruits
            ['🚗', '🚕', '🚙', '🚌', '🏎️', '🚓', '🚑', '🚒'], // Vehicles
            ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🏉', '🎱'], // Sports
            ['🐳', '🐬', '🐟', '🦈', '🦀', '🐙', '🦐', '🐠'], // Sea Animals
            ['🎸', '🎹', '🥁', '🎷', '🎺', '🎻', '🪕', '🪗']  // Instruments
        ];

        function getLevelConfig(levelIndex) {
            let size;
            if (levelIndex === 0) size = 3;
            else if (levelIndex === 1) size = 4;
            else if (levelIndex === 2) size = 5;
            else size = Math.min(6, 6 + Math.floor((levelIndex - 3) / 2));

            let moves = 10 + (levelIndex * 5);
            return { size, moves, name: `Level ${levelIndex + 1} (${size}x${size})` };
        }

        function generateShuffledGrid(levelIndex) {
            let cfg = getLevelConfig(levelIndex);
            let size = cfg.size;

            let emojis = [];
            let catIdx = 0;
            while (emojis.length < size * size) {
                let cat = ALL_CATEGORIES[catIdx % ALL_CATEGORIES.length];
                let slicedCat = cat.slice(0, size);
                for (let e of slicedCat) {
                    if (emojis.length < size * size && !emojis.includes(e)) {
                        emojis.push(e);
                    }
                }
                catIdx++;
            }

            let grid;
            do {
                for (let i = emojis.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [emojis[i], emojis[j]] = [emojis[j], emojis[i]];
                }
                grid = [];
                for (let i = 0; i < size; i++) {
                    grid.push(emojis.slice(i * size, i * size + size));
                }
            } while (checkWin(grid, levelIndex).isWon);

            return grid;
        }

        function getCompletedRowsAndCols(grid, levelIndex) {
            let size = grid.length;
            function getCatIndex(emoji) {
                return ALL_CATEGORIES.findIndex(cat => cat.includes(emoji));
            }

            let lockedRows = new Array(size).fill(false);
            let lockedCols = new Array(size).fill(false);

            for (let r = 0; r < size; r++) {
                let firstCat = getCatIndex(grid[r][0]);
                let isRowValid = firstCat !== -1;
                for (let c = 1; c < size; c++) {
                    if (getCatIndex(grid[r][c]) !== firstCat) {
                        isRowValid = false;
                        break;
                    }
                }
                if (isRowValid) lockedRows[r] = true;
            }

            for (let c = 0; c < size; c++) {
                let firstCat = getCatIndex(grid[0][c]);
                let isColValid = firstCat !== -1;
                for (let r = 1; r < size; r++) {
                    if (getCatIndex(grid[r][c]) !== firstCat) {
                        isColValid = false;
                        break;
                    }
                }
                if (isColValid) lockedCols[c] = true;
            }

            return { lockedRows, lockedCols };
        }

        function checkWin(grid, levelIndex) {
            let size = grid.length;
            let { lockedRows, lockedCols } = getCompletedRowsAndCols(grid, levelIndex);
            
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (!lockedRows[r] && !lockedCols[c]) {
                        return { isWon: false };
                    }
                }
            }
            return { isWon: true };
        }

        function vibrate(pattern = 50) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        function generateRandomId() {
            return Math.random().toString(36).substring(2, 8);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const view = urlParams.get('view');
        const playerNum = urlParams.get('p');
        const hostPeerId = urlParams.get('host');
        const localMode = urlParams.get('local') === 'true';

        if (view === 'ctrl' && playerNum && hostPeerId) {
            initController(playerNum, hostPeerId);
        } else if (localMode) {
            initLocalGame();
        } else {
            initHost();
        }

        function initLocalGame() {
            let initialCfg = getLevelConfig(0);
            let gameState = {
                gameMode: 'coop',
                status: 'playing',
                level: 0,
                movesLeft: initialCfg.moves,
                grid: generateShuffledGrid(0),
                grid2: generateShuffledGrid(0), // For versus mode player 2
                p1: { score: 0, cursor: {r: 0, c: 0}, selected: null },
                p2: { score: 0, cursor: {r: initialCfg.size - 1, c: initialCfg.size - 1}, selected: null }
            };

            window.setGameMode = function(mode) {
                gameState.gameMode = mode;
                renderLocalUI();
            };

            window.handleLocalAction = function(pKey, action) {
                let cfg = getLevelConfig(gameState.level);
                let size = cfg.size;

                if (gameState.status === 'playing') {
                    let cursor = gameState[pKey].cursor;
                    let activeGrid = (gameState.gameMode === 'versus' && pKey === 'p2') ? gameState.grid2 : gameState.grid;
                    let { lockedRows, lockedCols } = getCompletedRowsAndCols(activeGrid, gameState.level);

                    if (action === 'up') cursor.r = Math.max(0, cursor.r - 1);
                    if (action === 'down') cursor.r = Math.min(size - 1, cursor.r + 1);
                    if (action === 'left') cursor.c = Math.max(0, cursor.c - 1);
                    if (action === 'right') cursor.c = Math.min(size - 1, cursor.c + 1);

                    if (action === 'select') {
                        let curR = cursor.r;
                        let curC = cursor.c;

                        if (lockedRows[curR] || lockedCols[curC]) {
                            return;
                        }

                        if (gameState.gameMode === 'coop') {
                            if (gameState[pKey].selected) {
                                gameState[pKey].selected = null;
                            } else {
                                gameState[pKey].selected = { ...cursor };
                            }

                            if (gameState.p1.selected && gameState.p2.selected) {
                                let r1 = gameState.p1.selected.r;
                                let c1 = gameState.p1.selected.c;
                                let r2 = gameState.p2.selected.r;
                                let c2 = gameState.p2.selected.c;

                                let currentLocks = getCompletedRowsAndCols(gameState.grid, gameState.level);
                                if (!currentLocks.lockedRows[r1] && !currentLocks.lockedCols[c1] && !currentLocks.lockedRows[r2] && !currentLocks.lockedCols[c2]) {
                                    let g = gameState.grid;
                                    let t1 = g[r1][c1];
                                    let t2 = g[r2][c2];
                                    g[r1][c1] = t2;
                                    g[r2][c2] = t1;
                                    gameState.movesLeft--;
                                }
                                gameState.p1.selected = null;
                                gameState.p2.selected = null;
                            }
                        } else {
                            // Versus mode: independent player grids & selections
                            if (gameState[pKey].selected) {
                                let r1 = gameState[pKey].selected.r;
                                let c1 = gameState[pKey].selected.c;
                                let r2 = curR;
                                let c2 = curC;

                                if (r1 !== r2 || c1 !== c2) {
                                    if (!lockedRows[r2] && !lockedCols[c2]) {
                                        let g = activeGrid;
                                        let t1 = g[r1][c1];
                                        let t2 = g[r2][c2];
                                        g[r1][c1] = t2;
                                        g[r2][c2] = t1;
                                    }
                                }
                                gameState[pKey].selected = null;
                            } else {
                                gameState[pKey].selected = { ...cursor };
                            }
                        }

                        if (gameState.gameMode === 'coop') {
                            let winCheck = checkWin(gameState.grid, gameState.level);
                            if (winCheck.isWon) {
                                gameState.status = 'won';
                            } else if (gameState.movesLeft <= 0) {
                                gameState.status = 'gameover';
                            }
                        } else {
                            let p1Win = checkWin(gameState.grid, gameState.level).isWon;
                            let p2Win = checkWin(gameState.grid2, gameState.level).isWon;
                            if (p1Win || p2Win) {
                                gameState.status = 'won';
                                gameState.winner = p1Win && p2Win ? 'Tie' : p1Win ? 'Player 1' : 'Player 2';
                            }
                        }
                    }
                    renderLocalUI();
                } else if (gameState.status === 'won' || gameState.status === 'gameover') {
                    if (action === 'next_level') {
                        gameState.level++;
                        let newCfg = getLevelConfig(gameState.level);
                        gameState.movesLeft = newCfg.moves;
                        gameState.status = 'playing';
                        gameState.grid = generateShuffledGrid(gameState.level);
                        gameState.grid2 = generateShuffledGrid(gameState.level);
                        gameState.p1.selected = null;
                        gameState.p2.selected = null;
                        gameState.p1.cursor = {r: 0, c: 0};
                        gameState.p2.cursor = {r: newCfg.size - 1, c: newCfg.size - 1};
                        renderLocalUI();
                    } else if (action === 'restart') {
                        gameState.level = 0;
                        let newCfg = getLevelConfig(0);
                        gameState.movesLeft = newCfg.moves;
                        gameState.status = 'playing';
                        gameState.grid = generateShuffledGrid(0);
                        gameState.grid2 = generateShuffledGrid(0);
                        gameState.p1.selected = null;
                        gameState.p2.selected = null;
                        gameState.p1.cursor = {r: 0, c: 0};
                        gameState.p2.cursor = {r: newCfg.size - 1, c: newCfg.size - 1};
                        renderLocalUI();
                    }
                }
            };

            window.addEventListener('keydown', (e) => {
                if (e.repeat) return;
                if (e.key === 'w' || e.key === 'W') handleLocalAction('p1', 'up');
                if (e.key === 's' || e.key === 'S') handleLocalAction('p1', 'down');
                if (e.key === 'a' || e.key === 'A') handleLocalAction('p1', 'left');
                if (e.key === 'd' || e.key === 'D') handleLocalAction('p1', 'right');
                if (e.code === 'Space') { e.preventDefault(); handleLocalAction('p1', 'select'); }

                if (e.key === 'ArrowUp') { e.preventDefault(); handleLocalAction('p2', 'up'); }
                if (e.key === 'ArrowDown') { e.preventDefault(); handleLocalAction('p2', 'down'); }
                if (e.key === 'ArrowLeft') { e.preventDefault(); handleLocalAction('p2', 'left'); }
                if (e.key === 'ArrowRight') { e.preventDefault(); handleLocalAction('p2', 'right'); }
                if (e.key === 'Enter') { e.preventDefault(); handleLocalAction('p2', 'select'); }
            });

            window.renderLocalUI = function() {
                const appDiv = document.getElementById('app');
                let cfg = getLevelConfig(gameState.level);
                let size = cfg.size;

                function renderGridMarkup(grid, pKey) {
                    let { lockedRows, lockedCols } = getCompletedRowsAndCols(grid, gameState.level);
                    let gridHtml = '';
                    for (let r = 0; r < size; r++) {
                        for (let c = 0; c < size; c++) {
                            let isLocked = lockedRows[r] || lockedCols[c];
                            let tileSize = size === 3 ? 'w-16 h-16 text-3xl' : size === 4 ? 'w-14 h-14 text-2xl' : size === 5 ? 'w-12 h-12 text-xl' : 'w-10 h-10 text-lg';
                            let classes = `tile ${tileSize} bg-gray-900 border border-gray-800 rounded-2xl flex items-center justify-center relative shadow-xl ${isLocked ? 'locked-glow' : ''}`;
                            let innerHtml = `<span>${grid[r][c]}</span>`;
                            let overlays = '';

                            if (gameState[pKey].selected && gameState[pKey].selected.r === r && gameState[pKey].selected.c === c) {
                                overlays += `<div class="absolute inset-0 rounded-2xl ${pKey === 'p1' ? 'selected-p1' : 'selected-p2'} pointer-events-none"></div>`;
                            }
                            if (gameState[pKey].cursor.r === r && gameState[pKey].cursor.c === c) {
                                overlays += `<div class="absolute inset-0 rounded-2xl ${pKey === 'p1' ? 'cursor-p1' : 'cursor-p2'} pointer-events-none"></div>`;
                            }

                            gridHtml += `<div class="${classes}">${innerHtml}${overlays}</div>`;
                        }
                    }
                    return gridHtml;
                }

                if (gameState.gameMode === 'coop') {
                    let gridHtml = renderGridMarkup(gameState.grid, 'p1');
                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center p-4">
                            <div class="mb-2 flex items-center space-x-4">
                                <span class="px-4 py-1.5 rounded-full bg-purple-900/60 border border-purple-500/50 text-purple-300 font-semibold text-sm uppercase tracking-wider">${cfg.name}</span>
                                <div class="flex bg-gray-900 p-1 rounded-xl border border-gray-800">
                                    <button onclick="setGameMode('coop')" class="px-3 py-1 rounded-lg text-xs font-bold transition-colors bg-purple-600 text-white">Co-op</button>
                                    <button onclick="setGameMode('versus')" class="px-3 py-1 rounded-lg text-xs font-bold transition-colors text-gray-400 hover:text-white">Versus</button>
                                </div>
                                <span class="px-4 py-1.5 rounded-full bg-amber-950/60 border border-amber-500/50 text-amber-300 font-bold text-sm">Moves Left: ${gameState.movesLeft}</span>
                                <a href="${window.location.origin + window.location.pathname}" class="text-xs text-gray-400 hover:text-white underline">Back to QR Mode</a>
                            </div>

                            <div class="mb-4 flex space-x-12 text-sm">
                                <div class="flex items-center space-x-2 bg-red-950/40 px-3 py-1 rounded-lg border border-red-900/50">
                                    <div class="w-4 h-4 bg-red-500 rounded-full"></div>
                                    <span class="font-bold text-red-300">P1 (WASD + Space)</span>
                                </div>
                                <div class="flex items-center space-x-2 bg-blue-950/40 px-3 py-1 rounded-lg border border-blue-900/50">
                                    <div class="w-4 h-4 bg-blue-500 rounded-full"></div>
                                    <span class="font-bold text-blue-300">P2 (Arrows + Enter)</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-${size} gap-2.5 bg-gray-900/90 p-5 rounded-[2rem] shadow-2xl border border-gray-800 relative">
                                ${gridHtml}
                                ${gameState.status === 'won' ? `
                                    <div class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center z-50 p-6">
                                        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-2 drop-shadow-lg">LEVEL CLEARED!</h1>
                                        <p class="text-gray-300 mb-6">Fantastic teamwork solving ${cfg.name}!</p>
                                        <div class="flex space-x-4">
                                            <button onclick="handleLocalAction('p1', 'next_level')" class="px-6 py-3 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-500 transition-colors cursor-pointer shadow-lg">Next Level ➡️</button>
                                            <button onclick="handleLocalAction('p1', 'restart')" class="px-6 py-3 rounded-xl bg-gray-800 text-gray-300 font-bold hover:bg-gray-700 transition-colors cursor-pointer">Restart</button>
                                        </div>
                                    </div>
                                ` : gameState.status === 'gameover' ? `
                                    <div class="absolute inset-0 bg-red-950/90 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center z-50 p-6">
                                        <h1 class="text-5xl font-black text-red-400 mb-2 drop-shadow-lg">GAME OVER</h1>
                                        <p class="text-gray-300 mb-6">You ran out of moves on ${cfg.name}!</p>
                                        <button onclick="handleLocalAction('p1', 'restart')" class="px-6 py-3 rounded-xl bg-gray-800 text-gray-300 font-bold hover:bg-gray-700 transition-colors cursor-pointer">Try Again</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                } else {
                    // Versus mode with 2 separate grids
                    let p1GridHtml = renderGridMarkup(gameState.grid, 'p1');
                    let p2GridHtml = renderGridMarkup(gameState.grid2, 'p2');
                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center p-4">
                            <div class="mb-2 flex items-center space-x-4">
                                <span class="px-4 py-1.5 rounded-full bg-purple-900/60 border border-purple-500/50 text-purple-300 font-semibold text-sm uppercase tracking-wider">${cfg.name} (Versus Battle)</span>
                                <div class="flex bg-gray-900 p-1 rounded-xl border border-gray-800">
                                    <button onclick="setGameMode('coop')" class="px-3 py-1 rounded-lg text-xs font-bold transition-colors text-gray-400 hover:text-white">Co-op</button>
                                    <button onclick="setGameMode('versus')" class="px-3 py-1 rounded-lg text-xs font-bold transition-colors bg-red-600 text-white">Versus</button>
                                </div>
                                <a href="${window.location.origin + window.location.pathname}" class="text-xs text-gray-400 hover:text-white underline">Back to QR Mode</a>
                            </div>

                            <div class="flex flex-row gap-8 items-center justify-center relative">
                                <!-- P1 Board -->
                                <div class="flex flex-col items-center">
                                    <div class="flex items-center space-x-2 bg-red-950/40 px-3 py-1 rounded-lg border border-red-900/50 mb-2">
                                        <div class="w-4 h-4 bg-red-500 rounded-full"></div>
                                        <span class="font-bold text-red-300 text-sm">Player 1 (WASD + Space)</span>
                                    </div>
                                    <div class="grid grid-cols-${size} gap-2 bg-gray-900/90 p-4 rounded-3xl shadow-2xl border border-gray-800">
                                        ${p1GridHtml}
                                    </div>
                                </div>

                                <div class="text-2xl font-black text-gray-600">VS</div>

                                <!-- P2 Board -->
                                <div class="flex flex-col items-center">
                                    <div class="flex items-center space-x-2 bg-blue-950/40 px-3 py-1 rounded-lg border border-blue-900/50 mb-2">
                                        <div class="w-4 h-4 bg-blue-500 rounded-full"></div>
                                        <span class="font-bold text-blue-300 text-sm">Player 2 (Arrows + Enter)</span>
                                    </div>
                                    <div class="grid grid-cols-${size} gap-2 bg-gray-900/90 p-4 rounded-3xl shadow-2xl border border-gray-800">
                                        ${p2GridHtml}
                                    </div>
                                </div>

                                ${gameState.status === 'won' ? `
                                    <div class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center z-50 p-6">
                                        <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-2 drop-shadow-lg">${gameState.winner} WINS!</h1>
                                        <p class="text-gray-300 mb-6">Completed ${cfg.name} first!</p>
                                        <div class="flex space-x-4">
                                            <button onclick="handleLocalAction('p1', 'next_level')" class="px-6 py-3 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-500 transition-colors cursor-pointer shadow-lg">Next Level ➡️</button>
                                            <button onclick="handleLocalAction('p1', 'restart')" class="px-6 py-3 rounded-xl bg-gray-800 text-gray-300 font-bold hover:bg-gray-700 transition-colors cursor-pointer">Restart</button>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            };

            renderLocalUI();
        }

        function initHost() {
            const uniqueId = generateRandomId();
            const p1PeerId = `emoji_host_p1_${uniqueId}`;
            const p2PeerId = `emoji_host_p2_${uniqueId}`;

            let initialCfg = getLevelConfig(0);
            let gameState = {
                gameMode: 'coop',
                status: 'waiting',
                level: 0,
                movesLeft: initialCfg.moves,
                grid: generateShuffledGrid(0),
                grid2: generateShuffledGrid(0),
                p1: { connected: false, ready: false, cursor: {r: 0, c: 0}, selected: null },
                p2: { connected: false, ready: false, cursor: {r: initialCfg.size - 1, c: initialCfg.size - 1}, selected: null }
            };

            let p1Connection = null;
            let p2Connection = null;

            const peerOptions = {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            };

            let peer1, peer2;
            try {
                peer1 = new Peer(p1PeerId, peerOptions);
                peer2 = new Peer(p2PeerId, peerOptions);
            } catch(e) {
                peer1 = new Peer(p1PeerId);
                peer2 = new Peer(p2PeerId);
            }

            peer1.on('connection', (conn) => {
                p1Connection = conn;
                gameState.p1.connected = true;
                setupConnectionHandlers(conn, 'p1');
                broadcastState();
            });

            peer2.on('connection', (conn) => {
                p2Connection = conn;
                gameState.p2.connected = true;
                setupConnectionHandlers(conn, 'p2');
                broadcastState();
            });

            function setupConnectionHandlers(conn, pKey) {
                conn.on('data', (data) => {
                    handleControllerAction(pKey, data);
                });
                conn.on('close', () => {
                    gameState[pKey].connected = false;
                    gameState[pKey].ready = false;
                    gameState.status = 'waiting';
                    broadcastState();
                });
            }

            function broadcastState() {
                if (p1Connection && p1Connection.open) p1Connection.send({ type: 'STATE', state: gameState });
                if (p2Connection && p2Connection.open) p2Connection.send({ type: 'STATE', state: gameState });
                renderHostUI();
            }

            window.setHostGameMode = function(mode) {
                gameState.gameMode = mode;
                broadcastState();
            };

            window.handleHostAction = function(action) {
                if (gameState.status === 'won' || gameState.status === 'gameover') {
                    if (action === 'next_level') {
                        gameState.level++;
                        let newCfg = getLevelConfig(gameState.level);
                        gameState.movesLeft = newCfg.moves;
                        gameState.status = 'playing';
                        gameState.grid = generateShuffledGrid(gameState.level);
                        gameState.grid2 = generateShuffledGrid(gameState.level);
                        gameState.p1.selected = null;
                        gameState.p2.selected = null;
                        gameState.p1.cursor = {r: 0, c: 0};
                        gameState.p2.cursor = {r: newCfg.size - 1, c: newCfg.size - 1};
                        broadcastState();
                    } else if (action === 'restart') {
                        gameState.status = 'waiting';
                        gameState.level = 0;
                        let newCfg = getLevelConfig(0);
                        gameState.movesLeft = newCfg.moves;
                        gameState.grid = generateShuffledGrid(0);
                        gameState.grid2 = generateShuffledGrid(0);
                        gameState.p1.ready = false;
                        gameState.p2.ready = false;
                        gameState.p1.selected = null;
                        gameState.p2.selected = null;
                        gameState.p1.cursor = {r: 0, c: 0};
                        gameState.p2.cursor = {r: newCfg.size - 1, c: newCfg.size - 1};
                        broadcastState();
                    }
                }
            };

            function handleControllerAction(pKey, actionData) {
                const { action, payload } = actionData;
                let cfg = getLevelConfig(gameState.level);
                let size = cfg.size;

                if (gameState.status === 'waiting') {
                    if (action === 'ready') {
                        gameState[pKey].ready = true;
                        if (gameState.p1.ready && gameState.p2.ready) {
                            gameState.status = 'playing';
                        }
                        broadcastState();
                    }
                } else if (gameState.status === 'playing') {
                    let cursor = gameState[pKey].cursor;
                    let activeGrid = (gameState.gameMode === 'versus' && pKey === 'p2') ? gameState.grid2 : gameState.grid;
                    let { lockedRows, lockedCols } = getCompletedRowsAndCols(activeGrid, gameState.level);

                    if (action === 'move') {
                        if (payload === 'up') cursor.r = Math.max(0, cursor.r - 1);
                        if (payload === 'down') cursor.r = Math.min(size - 1, cursor.r + 1);
                        if (payload === 'left') cursor.c = Math.max(0, cursor.c - 1);
                        if (payload === 'right') cursor.c = Math.min(size - 1, cursor.c + 1);
                        broadcastState();
                    }
                    if (action === 'select') {
                        let curR = cursor.r;
                        let curC = cursor.c;

                        if (lockedRows[curR] || lockedCols[curC]) {
                            return;
                        }

                        if (gameState.gameMode === 'coop') {
                            if (gameState[pKey].selected) {
                                gameState[pKey].selected = null;
                            } else {
                                gameState[pKey].selected = { ...cursor };
                            }

                            if (gameState.p1.selected && gameState.p2.selected) {
                                let r1 = gameState.p1.selected.r;
                                let c1 = gameState.p1.selected.c;
                                let r2 = gameState.p2.selected.r;
                                let c2 = gameState.p2.selected.c;

                                let currentLocks = getCompletedRowsAndCols(gameState.grid, gameState.level);
                                if (!currentLocks.lockedRows[r1] && !currentLocks.lockedCols[c1] && !currentLocks.lockedRows[r2] && !currentLocks.lockedCols[c2]) {
                                    let g = gameState.grid;
                                    let t1 = g[r1][c1];
                                    let t2 = g[r2][c2];
                                    g[r1][c1] = t2;
                                    g[r2][c2] = t1;
                                    gameState.movesLeft--;
                                }
                                gameState.p1.selected = null;
                                gameState.p2.selected = null;
                            }
                        } else {
                            if (gameState[pKey].selected) {
                                let r1 = gameState[pKey].selected.r;
                                let c1 = gameState[pKey].selected.c;
                                let r2 = curR;
                                let c2 = curC;

                                if (r1 !== r2 || c1 !== c2) {
                                    if (!lockedRows[r2] && !lockedCols[c2]) {
                                        let g = activeGrid;
                                        let t1 = g[r1][c1];
                                        let t2 = g[r2][c2];
                                        g[r1][c1] = t2;
                                        g[r2][c2] = t1;
                                    }
                                }
                                gameState[pKey].selected = null;
                            } else {
                                gameState[pKey].selected = { ...cursor };
                            }
                        }

                        if (gameState.gameMode === 'coop') {
                            let winCheck = checkWin(gameState.grid, gameState.level);
                            if (winCheck.isWon) {
                                gameState.status = 'won';
                            } else if (gameState.movesLeft <= 0) {
                                gameState.status = 'gameover';
                            }
                        } else {
                            let p1Win = checkWin(gameState.grid, gameState.level).isWon;
                            let p2Win = checkWin(gameState.grid2, gameState.level).isWon;
                            if (p1Win || p2Win) {
                                gameState.status = 'won';
                                gameState.winner = p1Win && p2Win ? 'Tie' : p1Win ? 'Player 1' : 'Player 2';
                            }
                        }

                        broadcastState();
                    }
                } else if (gameState.status === 'won' || gameState.status === 'gameover') {
                    if (action === 'next_level' || action === 'restart') {
                        window.handleHostAction(action);
                    }
                }
            }

            window.renderHostUI = function() {
                const appDiv = document.getElementById('app');
                const baseUrl = window.location.origin + window.location.pathname;
                const p1Url = `${baseUrl}?view=ctrl&p=1&host=${p1PeerId}`;
                const p2Url = `${baseUrl}?view=ctrl&p=2&host=${p2PeerId}`;
                const localUrl = `${baseUrl}?local=true`;

                if (gameState.status === 'waiting') {
                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center w-full max-w-4xl p-6 bg-gray-900 border border-gray-800 rounded-3xl shadow-2xl">

                            <p class="text-gray-400 mb-4 text-sm text-center">Match emojis in rows/cols! Scan QR codes with smartphones in landscape mode.</p>
                            
                            <div class="flex bg-gray-800 p-1.5 rounded-2xl border border-gray-700 mb-6">
                                <button onclick="setHostGameMode('coop')" class="px-6 py-2 rounded-xl text-sm font-bold transition-colors ${gameState.gameMode === 'coop' ? 'bg-purple-600 text-white' : 'text-gray-400 hover:text-white'}">Co-op Mode (Moves Limit)</button>
                                <button onclick="setHostGameMode('versus')" class="px-6 py-2 rounded-xl text-sm font-bold transition-colors ${gameState.gameMode === 'versus' ? 'bg-red-600 text-white' : 'text-gray-400 hover:text-white'}">Versus Mode (1 Grid Each)</button>
                            </div>

                            <div class="flex flex-col md:flex-row w-full justify-around items-center gap-6 mb-6">
                                <div class="flex flex-col items-center p-4 bg-gray-800/80 rounded-2xl border-2 ${gameState.p1.connected ? 'border-red-500' : 'border-gray-700'}">
                                    <h2 class="text-xl font-bold mb-2 text-red-400">Player 1 (Red)</h2>
                                    <div id="qr-p1" class="bg-white p-2 rounded-xl mb-2 shadow-lg"></div>
                                    <div class="h-6 text-xs text-center">
                                        ${gameState.p1.ready ? '<span class="text-green-400 font-bold">READY!</span>' : 
                                          gameState.p1.connected ? '<span class="text-yellow-400">Connected, waiting...</span>' : 
                                          '<span class="text-gray-400 animate-pulse">Scan with smartphone</span>'}
                                    </div>
                                </div>

                                <div class="text-2xl font-bold text-gray-600">VS / CO-OP</div>

                                <div class="flex flex-col items-center p-4 bg-gray-800/80 rounded-2xl border-2 ${gameState.p2.connected ? 'border-blue-500' : 'border-gray-700'}">
                                    <h2 class="text-xl font-bold mb-2 text-blue-400">Player 2 (Blue)</h2>
                                    <div id="qr-p2" class="bg-white p-2 rounded-xl mb-2 shadow-lg"></div>
                                    <div class="h-6 text-xs text-center">
                                        ${gameState.p2.ready ? '<span class="text-green-400 font-bold">READY!</span>' : 
                                          gameState.p2.connected ? '<span class="text-yellow-400">Connected, waiting...</span>' : 
                                          '<span class="text-gray-400 animate-pulse">Scan with smartphone</span>'}
                                    </div>
                                </div>
                            </div>

                            <div class="border-t border-gray-800 pt-4 w-full flex flex-col items-center">
                                <span class="text-gray-400 text-sm mb-2">Don't have 2 smartphones handy?</span>
                                <a href="${localUrl}" class="px-6 py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm transition-colors shadow-lg shadow-purple-900/40">
                                    💻 Play Locally on This Desktop
                                </a>
                            </div>
                        </div>
                    `;

                    const qr1El = document.getElementById('qr-p1');
                    if (qr1El && qr1El.innerHTML === '') {
                        new QRCode(qr1El, { text: p1Url, width: 130, height: 130, colorDark : "#000000", colorLight : "#ffffff" });
                    }
                    const qr2El = document.getElementById('qr-p2');
                    if (qr2El && qr2El.innerHTML === '') {
                        new QRCode(qr2El, { text: p2Url, width: 130, height: 130, colorDark : "#000000", colorLight : "#ffffff" });
                    }

                } else {
                    let cfg = getLevelConfig(gameState.level);
                    let size = cfg.size;

                    function renderHostGridMarkup(grid, pKey) {
                        let { lockedRows, lockedCols } = getCompletedRowsAndCols(grid, gameState.level);
                        let gridHtml = '';
                        for (let r = 0; r < size; r++) {
                            for (let c = 0; c < size; c++) {
                                let isLocked = lockedRows[r] || lockedCols[c];
                                let tileSize = size === 3 ? 'w-20 h-20 text-4xl' : size === 4 ? 'w-16 h-16 text-3xl' : size === 5 ? 'w-14 h-14 text-2xl' : 'w-12 h-12 text-xl';
                                let classes = `tile ${tileSize} bg-gray-900 border border-gray-800 rounded-2xl flex items-center justify-center relative shadow-xl ${isLocked ? 'locked-glow' : ''}`;
                                let innerHtml = `<span>${grid[r][c]}</span>`;
                                let overlays = '';

                                if (gameState[pKey].selected && gameState[pKey].selected.r === r && gameState[pKey].selected.c === c) {
                                    overlays += `<div class="absolute inset-0 rounded-2xl ${pKey === 'p1' ? 'selected-p1' : 'selected-p2'} pointer-events-none"></div>`;
                                }
                                if (gameState[pKey].cursor.r === r && gameState[pKey].cursor.c === c) {
                                    overlays += `<div class="absolute inset-0 rounded-2xl ${pKey === 'p1' ? 'cursor-p1' : 'cursor-p2'} pointer-events-none"></div>`;
                                }

                                gridHtml += `<div class="${classes}">${innerHtml}${overlays}</div>`;
                            }
                        }
                        return gridHtml;
                    }

                    if (gameState.gameMode === 'coop') {
                        let gridHtml = renderHostGridMarkup(gameState.grid, 'p1');
                        appDiv.innerHTML = `
                            <div class="flex flex-col items-center">
                                <div class="mb-4 flex items-center space-x-6">
                                    <span class="px-4 py-1.5 rounded-full bg-purple-900/60 border border-purple-500/50 text-purple-300 font-semibold text-sm uppercase tracking-wider">${cfg.name}</span>
                                    <span class="px-4 py-1.5 rounded-full bg-amber-950/60 border border-amber-500/50 text-amber-300 font-bold text-sm">Moves Left: ${gameState.movesLeft}</span>
                                </div>

                                <div class="mb-6 flex space-x-12">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-6 h-6 bg-red-500 rounded-full animate-pulse shadow-[0_0_15px_rgba(239,68,68,0.8)]"></div>
                                        <span class="text-xl font-bold text-gray-300">Player 1</span>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <div class="w-6 h-6 bg-blue-500 rounded-full animate-pulse shadow-[0_0_15px_rgba(59,130,246,0.8)]"></div>
                                        <span class="text-xl font-bold text-gray-300">Player 2</span>
                                    </div>
                                </div>

                                <div class="grid grid-cols-${size} gap-3 md:gap-4 bg-gray-900/90 p-6 md:p-8 rounded-[2rem] shadow-2xl border border-gray-800 relative">
                                    ${gridHtml}
                                    
                                    ${gameState.status === 'won' ? `
                                        <div class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center z-50 p-6">
                                            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-4 drop-shadow-lg text-center">LEVEL CLEARED!</h1>
                                            <p class="text-xl text-gray-300 mb-8 text-center">Fantastic teamwork solving ${cfg.name}!</p>
                                            <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md justify-center">
                                                <button onclick="handleHostAction('next_level')" class="px-6 py-4 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-lg shadow-lg shadow-purple-900/50 transition-colors cursor-pointer">Next Level ➡️</button>
                                                <button onclick="handleHostAction('restart')" class="px-6 py-4 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-lg transition-colors cursor-pointer">Restart Lobby</button>
                                            </div>
                                        </div>
                                    ` : gameState.status === 'gameover' ? `
                                        <div class="absolute inset-0 bg-red-950/90 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center z-50 p-6">
                                            <h1 class="text-5xl font-black text-red-400 mb-4 drop-shadow-lg text-center">GAME OVER</h1>
                                            <p class="text-xl text-gray-300 mb-8 text-center">You ran out of moves on ${cfg.name}!</p>
                                            <button onclick="handleHostAction('restart')" class="px-6 py-4 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-lg transition-colors cursor-pointer">Restart Lobby</button>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    } else {
                        let p1GridHtml = renderHostGridMarkup(gameState.grid, 'p1');
                        let p2GridHtml = renderHostGridMarkup(gameState.grid2, 'p2');
                        appDiv.innerHTML = `
                            <div class="flex flex-col items-center">
                                <div class="mb-4 flex items-center space-x-6">
                                    <span class="px-4 py-1.5 rounded-full bg-purple-900/60 border border-purple-500/50 text-purple-300 font-semibold text-sm uppercase tracking-wider">${cfg.name} (Versus Battle)</span>
                                </div>

                                <div class="flex flex-row gap-12 items-center justify-center relative">
                                    <div class="flex flex-col items-center">
                                        <div class="flex items-center space-x-2 bg-red-950/40 px-3 py-1 rounded-lg border border-red-900/50 mb-3">
                                            <div class="w-5 h-5 bg-red-500 rounded-full"></div>
                                            <span class="font-bold text-red-300 text-lg">Player 1 Grid</span>
                                        </div>
                                        <div class="grid grid-cols-${size} gap-3 bg-gray-900/90 p-6 rounded-[2rem] shadow-2xl border border-gray-800">
                                            ${p1GridHtml}
                                        </div>
                                    </div>

                                    <div class="text-3xl font-black text-gray-600">VS</div>

                                    <div class="flex flex-col items-center">
                                        <div class="flex items-center space-x-2 bg-blue-950/40 px-3 py-1 rounded-lg border border-blue-900/50 mb-3">
                                            <div class="w-5 h-5 bg-blue-500 rounded-full"></div>
                                            <span class="font-bold text-blue-300 text-lg">Player 2 Grid</span>
                                        </div>
                                        <div class="grid grid-cols-${size} gap-3 bg-gray-900/90 p-6 rounded-[2rem] shadow-2xl border border-gray-800">
                                            ${p2GridHtml}
                                        </div>
                                    </div>

                                    ${gameState.status === 'won' ? `
                                        <div class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center z-50 p-6">
                                            <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-4 drop-shadow-lg text-center">${gameState.winner} WINS!</h1>
                                            <p class="text-xl text-gray-300 mb-8 text-center">Completed ${cfg.name} first!</p>
                                            <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md justify-center">
                                                <button onclick="handleHostAction('next_level')" class="px-6 py-4 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-lg shadow-lg shadow-purple-900/50 transition-colors cursor-pointer">Next Level ➡️</button>
                                                <button onclick="handleHostAction('restart')" class="px-6 py-4 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-lg transition-colors cursor-pointer">Restart Lobby</button>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    }
                }
            };

            renderHostUI();
        }

        function initController(playerNum, hostPeerId) {
            const appDiv = document.getElementById('app');
            const themeColor = playerNum === '1' ? 'red' : 'blue';
            const themeHex = playerNum === '1' ? '#ef4444' : '#3b82f6';
            
            document.body.style.backgroundColor = playerNum === '1' ? '#2a0d0d' : '#0d1b2a';

            appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full w-full p-6 text-center">
                    <div class="text-3xl font-black text-${themeColor}-400 mb-4">PLAYER ${playerNum}</div>
                    <div class="text-lg text-gray-300 animate-pulse">Connecting to Desktop Host...</div>
                </div>
            `;

            let clientPeer;
            try {
                clientPeer = new Peer({
                    host: '0.peerjs.com',
                    port: 443,
                    secure: true,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });
            } catch(e) {
                clientPeer = new Peer();
            }

            let conn = null;
            let latestState = null;

            clientPeer.on('open', () => {
                conn = clientPeer.connect(hostPeerId);
                
                conn.on('open', () => {
                    renderControllerScreen('waiting');
                });

                conn.on('data', (data) => {
                    if (data.type === 'STATE') {
                        latestState = data.state;
                        renderControllerScreen(latestState.status);
                    }
                });

                conn.on('close', () => {
                    appDiv.innerHTML = `<div class="text-red-400 text-xl font-bold">Disconnected from Host.</div>`;
                });
            });

            window.sendAction = function(action, payload = null) {
                vibrate(40);
                if (conn && conn.open) {
                    conn.send({ action, payload });
                }
            };

            function renderControllerScreen(status) {
                const pKey = `p${playerNum}`;
                const pData = latestState ? latestState[pKey] : null;

                if (status === 'waiting') {
                    const isReady = pData ? pData.ready : false;
                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full w-full p-6 text-center">
                            <div class="text-3xl font-black text-${themeColor}-400 mb-6">PLAYER ${playerNum}</div>
                            ${isReady ? 
                                `<div class="text-2xl font-bold text-green-400 animate-pulse">Waiting for other player...</div>` :
                                `<button onclick="sendAction('ready')" class="px-12 py-8 rounded-3xl bg-gradient-to-tr from-${themeColor}-600 to-${themeColor}-400 shadow-[0_0_40px_${themeHex}80] text-white text-3xl font-black tracking-widest active:scale-95 transition-transform uppercase cursor-pointer">
                                    Start Game
                                 </button>`
                            }
                        </div>
                    `;
                } else if (status === 'playing') {
                    const isSelected = pData && pData.selected !== null;

                    appDiv.innerHTML = `
                        <div class="flex flex-row items-center justify-between h-full w-full px-10 py-4">
                            <!-- Left Side: Landscape D-Pad -->
                            <div class="flex flex-col items-center justify-center">
                                <div class="text-xs font-bold text-${themeColor}-300 uppercase mb-2 tracking-wider">${isSelected ? 'Tile Selected' : 'D-Pad'}</div>
                                <div class="grid grid-cols-3 gap-2 w-48 aspect-square relative">
                                    <div class="absolute inset-1/3 bg-gray-900 rounded-2xl opacity-50"></div>
                                    
                                    <div></div>
                                    <button onclick="sendAction('move', 'up')" class="ctrl-btn bg-gray-800 rounded-t-2xl shadow-lg border-t border-gray-700 flex items-center justify-center text-2xl cursor-pointer">▲</button>
                                    <div></div>
                                    
                                    <button onclick="sendAction('move', 'left')" class="ctrl-btn bg-gray-800 rounded-l-2xl shadow-lg border-l border-gray-700 flex items-center justify-center text-2xl cursor-pointer">◀</button>
                                    <div class="bg-gray-900 rounded-lg flex items-center justify-center">
                                        <div class="w-3 h-3 rounded-full bg-${themeColor}-500/50 shadow-[0_0_8px_${themeHex}]"></div>
                                    </div>
                                    <button onclick="sendAction('move', 'right')" class="ctrl-btn bg-gray-800 rounded-r-2xl shadow-lg border-r border-gray-700 flex items-center justify-center text-2xl cursor-pointer">▶</button>
                                    
                                    <div></div>
                                    <button onclick="sendAction('move', 'down')" class="ctrl-btn bg-gray-800 rounded-b-2xl shadow-lg border-b border-gray-700 flex items-center justify-center text-2xl cursor-pointer">▼</button>
                                    <div></div>
                                </div>
                            </div>

                            <!-- Right Side: Action Button -->
                            <div class="flex flex-col items-center justify-center w-64">
                                <button onclick="sendAction('select')" class="w-full py-10 rounded-3xl text-2xl font-black text-white shadow-2xl transition-all active:scale-95 cursor-pointer ${
                                    isSelected 
                                    ? 'bg-yellow-600 shadow-[0_0_30px_rgba(202,138,4,0.8)] border-2 border-yellow-400 animate-pulse'
                                    : `bg-${themeColor}-600 shadow-[0_0_30px_${themeHex}80] border-2 border-${themeColor}-400`
                                }">
                                    ${isSelected ? 'SWAP HERE' : 'SELECT TILE'}
                                </button>
                            </div>
                        </div>
                    `;
                } else if (status === 'won') {
                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full w-full p-6 text-center">
                            <div class="text-4xl mb-2">🏆</div>
                            <h1 class="text-2xl font-black text-yellow-400 mb-6 drop-shadow-lg">${latestState.winner ? `${latestState.winner} WON!` : 'LEVEL COMPLETED!'}</h1>
                            
                            <div class="flex space-x-4">
                                <button onclick="sendAction('next_level')" class="px-8 py-3 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 shadow-[0_0_30px_rgba(147,51,234,0.8)] text-white text-lg font-black active:scale-95 transition-transform uppercase cursor-pointer">
                                    Next Level ➡️
                                </button>
                                <button onclick="sendAction('restart')" class="px-6 py-3 rounded-full bg-gray-800 border border-gray-700 text-gray-300 text-base font-bold active:scale-95 transition-transform uppercase cursor-pointer">
                                    Restart
                                </button>
                            </div>
                        </div>
                    `;
                } else if (status === 'gameover') {
                    appDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full w-full p-6 text-center">
                            <div class="text-4xl mb-2">💀</div>
                            <h1 class="text-2xl font-black text-red-400 mb-6 drop-shadow-lg">GAME OVER</h1>
                            <button onclick="sendAction('restart')" class="px-8 py-3 rounded-full bg-gray-800 border border-gray-700 text-gray-300 text-base font-bold active:scale-95 transition-transform uppercase cursor-pointer">
                                Try Again
                            </button>
                        </div>
                    `;
                }
            }
        }
    </script>
</body>
